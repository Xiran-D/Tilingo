name: Release (Windows)

# 打 tag（v*）自动导出并发布；也可在 Actions 页手动触发，只产出 artifact 不建 Release。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Export Windows x64
    runs-on: windows-latest
    env:
      GODOT_VERSION: "4.7.2"
      PRESET: "Windows Desktop (Lite)"
      OUT_EXE: "dist/Tilingo.exe"
      ZIP_NAME: "Tilingo-windows-x64.zip"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ⚠️ setup-godot 的输入名是 **kebab-case**：`include-templates` / `use-dotnet`。
      #    写成下划线会被**静默忽略**（GitHub 不报未知输入），后果是"模板没下来 ⇒ 导出失败"，
      #    而且失败信息只有 `exit code 1`。2026-10-28 首发实测踩过这个坑。
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          include-templates: true
          use-dotnet: false

      - name: Verify Godot and export templates
        shell: bash
        run: |
          godot --version
          # 模板是"能不能导出"的先决条件。缺了就在这里红 —— 否则 Export 只会甩一句
          # `Process completed with exit code 1`，根本看不出是模板没装。
          ls -d "$APPDATA/Godot/export_templates"/* || {
            echo "★ 导出模板缺失：setup-godot 的 include-templates 没生效"; exit 1; }

      - name: Strip Steam SDK (Valve binaries are not redistributable)
        shell: bash
        run: |
          rm -rf addons/godotsteam
          rm -f steam_api64.dll steam_api.dll steam_appid.txt libgodotsteam*.dll

      - name: Import project resources
        shell: bash
        run: godot --headless --path . --import

      - name: Export
        shell: bash
        run: |
          mkdir -p dist
          godot --headless --path . --export-release "$PRESET" "$OUT_EXE"

      - name: Verify export is not empty
        shell: bash
        run: |
          ls -la dist/
          test -s "$OUT_EXE" || { echo "导出产物缺失或为空：$OUT_EXE"; exit 1; }
          SIZE=$(stat -c%s "$OUT_EXE")
          echo "exe 大小 = $SIZE 字节"
          # 单文件 exe 至少该有几十 MB（含运行时 + 字体），远低于这个数说明只导出了壳
          test "$SIZE" -gt 30000000 || { echo "产物过小，疑似未嵌入 pck"; exit 1; }

      - name: Package
        shell: pwsh
        run: |
          # ★ MIT 要求随二进制一并分发版权与许可声明 ⇒ LICENSE 等文本必须进 zip。
          #   Godot 只把资源打进 pck，.md / LICENSE 不会被自动带上，所以在这里显式拷。
          New-Item -ItemType Directory -Path stage -Force | Out-Null
          Copy-Item "$env:OUT_EXE" stage/
          Copy-Item LICENSE, README.md, README.en.md, THIRD-PARTY-NOTICES.md stage/
          Compress-Archive -Path "stage/*" -DestinationPath "$env:ZIP_NAME" -Force
          Get-Item $env:ZIP_NAME | Format-List Name, Length
          # 自证：解压回来核一遍，防止 -Path 写错把文件漏在外面
          Expand-Archive -Path "$env:ZIP_NAME" -DestinationPath check -Force
          Get-ChildItem check | Format-Table Name, Length
          foreach ($f in @($env:OUT_EXE.Split('/')[-1], 'LICENSE', 'THIRD-PARTY-NOTICES.md')) {
            if (-not (Test-Path "check/$f")) { Write-Error "zip 缺少 $f"; exit 1 }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tilingo-windows-x64
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
          fail_on_unmatched_files: true
